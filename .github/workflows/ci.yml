name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > /tmp/install.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            tail -n 20 /tmp/install.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::error::pnpm install exit code ${status}"
            exit $status
          fi
          tail -n 5 /tmp/install.log

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Privacy check
        run: pnpm run check:privacy
